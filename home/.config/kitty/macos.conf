font_size 15.0

# Option gauche = Alt (raccourcis <A-…> de nvim), Option droite garde les caractères spéciaux
macos_option_as_alt left

# macOS n'a pas les sockets abstraits (unix:@…) de kitty.conf: socket dans /tmp à la place
# (kitty ajoute -<pid> au nom, une instance par fenêtre kitty)
listen_on unix:/tmp/kitty-instance
