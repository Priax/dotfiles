# vim:ft=kitty

# Shell
shell fish
editor nvim

# Window settings
background_opacity 0.70
background_blur 1
window_padding_width 4
dynamic_background_opacity yes
allow_remote_control socket-only
listen_on unix:@kitty-instance
placement_strategy top-left
remember_window_size  yes

# Font settings (famille: bloc BEGIN_KITTY_FONTS plus bas; taille Mac: macos.conf)
font_size 12.0

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+n new_os_window_with_cwd

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Réglages propres à chaque OS (macos.conf, linux.conf), ignorés s'ils n'existent pas
globinclude ${KITTY_OS}.conf
