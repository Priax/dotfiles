# Micro virtuel avec annulation d'écho: retire du micro tout ce qui sort des haut-parleurs (jeu inclus).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      # Utilise le monitor de la sortie par défaut comme référence: pas besoin de router les apps.
      monitor.mode = true
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.gain_control = false
        # extended_filter et delay_agnostic retirés: webrtc-audio-processing 2.x ne les lit plus
        webrtc.high_pass_filter = true
      }
      capture.props = {
        node.name = "echo-cancel-capture"
        node.passive = true
      }
      source.props = {
        node.name = "echo-cancel-source"
        node.description = "Micro (anti-écho)"
      }
      sink.props = {
        node.name = "echo-cancel-sink"
        node.description = "Sortie anti-écho (interne)"
      }
      playback.props = {
        node.passive = true
      }
    }
  }
]
