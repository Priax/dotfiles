# Réglages SSH communs, inclus en tête de ~/.ssh/config par « dot apply ».
# Rien de secret ni de nom d'hôte ici: ~/.ssh/config (non suivi) garde les blocs Host.
# ssh garde la première valeur lue: une option posée ici l'emporte sur celles de ~/.ssh/config.

# Clés ajoutées à l'agent à leur première utilisation (passphrase demandée une seule fois)
AddKeysToAgent yes

# macOS: passphrase gardée dans le trousseau. Option propre au ssh d'Apple, ignorée ailleurs.
IgnoreUnknown UseKeychain
UseKeychain yes
